name: Dowlio
options:
  bundleIdPrefix: io.github.ifty-rahman
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
packages:
  DowlioKit:
    path: Packages/DowlioKit
targets:
  Dowlio:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: DowlioKit
        product: DowlioCore
      - package: DowlioKit
        product: DowlioEngine
      - package: DowlioKit
        product: DowlioStore
      - package: DowlioKit
        product: DowlioLibrary
      - package: DowlioKit
        product: DowlioConnect
    postCompileScripts:
      - name: Bundle Dowlio Connect
        basedOnDependencyAnalysis: false
        script: |
          destination="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Dowlio Connect"
          rm -rf "$destination"
          mkdir -p "$destination"
          rsync -a --exclude /test --exclude /package.json --exclude /node_modules --exclude .DS_Store "${SRCROOT}/Extension/" "$destination/"
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Dowlio
        CFBundleDisplayName: Dowlio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: Copyright © 2026 Dowlio contributors.
        # Plain http:// downloads are allowed and marked "Not secure" (docs/adr/0003).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ifty-rahman.Dowlio
        PRODUCT_NAME: Dowlio
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Scripts sign release builds, so Xcode doesn't.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
      configs:
        # Debug builds are signed ad hoc under the bundle ID. macOS refuses notifications to an app
        # whose signature names anything else, as the linker's own signature does.
        Debug:
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGN_IDENTITY: "-"
