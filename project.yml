name: Dowlio
options:
  bundleIdPrefix: io.github.ifty-rahman
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.4.4"
    CURRENT_PROJECT_VERSION: "8"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
packages:
  DowlioKit:
    path: Packages/DowlioKit
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Dowlio:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: DowlioKit
        product: DowlioCore
      - package: DowlioKit
        product: DowlioEngine
      - package: DowlioKit
        product: DowlioStore
      - package: DowlioKit
        product: DowlioLibrary
      - package: DowlioKit
        product: DowlioConnect
      - package: DowlioKit
        product: DowlioMedia
      - package: KeyboardShortcuts
      - package: Sparkle
    postCompileScripts:
      - name: Bundle Dowlio Connect
        basedOnDependencyAnalysis: false
        script: |
          destination="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Dowlio Connect"
          rm -rf "$destination"
          mkdir -p "$destination"
          rsync -a --exclude /test --exclude /package.json --exclude /package-lock.json --exclude /node_modules --exclude .DS_Store "${SRCROOT}/Extension/" "$destination/"
      - name: Bundle the ffmpeg helper
        basedOnDependencyAnalysis: false
        script: |
          helper="${SRCROOT}/build/ffmpeg/ffmpeg"
          destination="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          if [ "$CONFIGURATION" = "Release" ] && [ ! -x "$helper" ]; then
            echo "error: build/ffmpeg/ffmpeg is missing. Run scripts/build-ffmpeg.sh first."
            exit 1
          fi
          mkdir -p "$destination"
          if [ -x "$helper" ]; then
            cp -f "$helper" "$destination/ffmpeg"
          else
            echo "warning: build/ffmpeg/ffmpeg is missing, so this build can't join WebM. Run scripts/build-ffmpeg.sh."
          fi
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Dowlio
        CFBundleDisplayName: Dowlio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: Copyright © 2026 Dowlio contributors.
        # Plain http:// downloads are allowed and marked "Not secure" (docs/adr/0003).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        SUFeedURL: https://github.com/Ifty-Rahman/Dowlio/releases/latest/download/appcast.xml
        SUPublicEDKey: PGE9QpcxoUUbgMW7kQmdMDT9XYwbz8SeyritVI/wANM=
        SUEnableAutomaticChecks: true
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        NSAppleEventsUsageDescription: Dowlio reads the address of the page in front when you press the Send to Dowlio shortcut in a browser without Dowlio Connect.
    entitlements:
      path: App/Dowlio.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ifty-rahman.Dowlio
        PRODUCT_NAME: Dowlio
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Scripts sign release builds, so Xcode doesn't.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
      configs:
        # Debug builds are signed ad hoc under the bundle ID. macOS refuses notifications to an app
        # whose signature names anything else, as the linker's own signature does.
        Debug:
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGN_IDENTITY: "-"
