name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install XcodeGen
        run: |
          ./scripts/install-xcodegen.sh "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/xcodegen/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Restore the ffmpeg helper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/ffmpeg
          key: ffmpeg-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Test and build
        run: ./scripts/test.sh
